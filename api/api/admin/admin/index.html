<!DOCTYPE html>
<html lang="pt">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>USDTMZ - Administração</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      opacity: .8;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow:
        0 2px 8px rgba(0,0,0,.08);
    }

    .login {
      max-width: 420px;
      margin: 60px auto;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .logout {
      width: auto;
      float: right;
      margin-top: -42px;
      padding: 10px 16px;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #f1f1f1;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f5f5f5;
    }

    .status {
      font-weight: bold;
    }

    .empty {
      padding: 20px;
      text-align: center;
    }

  </style>

</head>

<body>

  <!-- LOGIN -->

  <section
    id="loginScreen"
    class="login card"
  >

    <h2>USDTMZ Admin</h2>

    <p>
      Acesso reservado ao administrador.
    </p>

    <form id="loginForm">

      <label for="email">
        E-mail
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">
        Senha
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button
        id="loginButton"
        type="submit"
      >
        Entrar
      </button>

    </form>

    <div
      id="loginMessage"
      class="message"
      aria-live="polite"
    ></div>

  </section>


  <!-- PAINEL -->

  <div
    id="adminScreen"
    class="hidden"
  >

    <header>

      <h1>USDTMZ — Administração</h1>

      <p id="adminEmail">
        Administrador
      </p>

      <button
        id="logoutButton"
        class="logout"
        type="button"
      >
        Sair
      </button>

    </header>


    <main>

      <section class="card">

        <h2>Pedidos</h2>

        <button
          id="refreshOrdersButton"
          type="button"
        >
          Atualizar pedidos
        </button>

        <div
          id="ordersMessage"
          class="message"
        >
          A carregar...
        </div>

      </section>


      <section class="card">

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>
                <th>ID</th>
                <th>Pedido</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Método</th>
                <th>MZN</th>
                <th>USDT</th>
                <th>Status</th>
                <th>M-Pesa</th>
                <th>e-Mola</th>
                <th>TX Blockchain</th>
                <th>Criado</th>
              </tr>

            </thead>

            <tbody id="ordersBody">

              <tr>
                <td
                  colspan="12"
                  class="empty"
                >
                  Nenhum pedido carregado.
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </section>

    </main>

  </div>


<script>

"use strict";


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   ELEMENTOS
========================= */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const adminScreen =
  document.getElementById(
    "adminScreen"
  );

const loginForm =
  document.getElementById(
    "loginForm"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginMessage =
  document.getElementById(
    "loginMessage"
  );

const adminEmail =
  document.getElementById(
    "adminEmail"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );

const ordersBody =
  document.getElementById(
    "ordersBody"
  );

const ordersMessage =
  document.getElementById(
    "ordersMessage"
  );

const refreshOrdersButton =
  document.getElementById(
    "refreshOrdersButton"
  );


/* =========================
   MOSTRAR PAINEL
========================= */

function showAdmin(admin) {

  loginScreen.classList.add(
    "hidden"
  );

  adminScreen.classList.remove(
    "hidden"
  );

  adminEmail.textContent =
    admin?.email ||
    "Administrador";

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document.getElementById(
        "email"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;

    loginButton.disabled =
      true;

    loginMessage.textContent =
      "A entrar...";

    try {

      const response =
        await fetch(
          "/api/admin/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
              email,
              password
            })
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data?.error ||
          "Falha no login."
        );

      }

      loginForm.reset();

      showAdmin(
        data.admin
      );

      await loadOrders();

    } catch (error) {

      loginMessage.textContent =
        error?.message ||
        "Não foi possível entrar.";

    } finally {

      loginButton.disabled =
        false;

    }

  }
);


/* =========================
   VERIFICAR SESSÃO
========================= */

async function checkSession() {

  try {

    const response =
      await fetch(
        "/api/admin/session",
        {
          method: "GET",

          headers: {
            "Accept":
              "application/json"
          },

          credentials: "include",

          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (
      response.ok &&
      data.success &&
      data.authenticated
    ) {

      showAdmin(
        data.admin
      );

      await loadOrders();

      return;

    }

  } catch (error) {

    console.error(
      "SESSION ERROR:",
      error
    );

  }

  loginScreen.classList.remove(
    "hidden"
  );

  adminScreen.classList.add(
    "hidden"
  );

}


/* =========================
   PEDIDOS
========================= */

async function loadOrders() {

  ordersMessage.textContent =
    "A carregar pedidos...";

  try {

    /*
     * Por enquanto usamos a API
     * existente /api/order.
     *
     * Depois criaremos uma API
     * exclusiva do administrador
     * para listar pedidos.
     */

    const response =
      await fetch(
        "/api/order",
        {
          method: "GET",

          headers: {
            "Accept":
              "application/json"
          },

          credentials: "include",

          cache: "no-store"
        }
      );

    if (response.status === 401) {

      throw new Error(
        "Sessão expirada."
      );

    }

    const data =
      await response.json();

    /*
     * A API /api/order atual pode
     * não possuir GET.
     */

    if (!response.ok) {

      throw new Error(
        data?.error ||
        "Não foi possível carregar pedidos."
      );

    }

    const orders =
      Array.isArray(data)
        ? data
        : data.orders || [];

    renderOrders(
      orders
    );

    ordersMessage.textContent =
      `${orders.length} pedido(s) carregado(s).`;

  } catch (error) {

    console.error(
      "ORDERS ERROR:",
      error
    );

    ordersMessage.textContent =
      error?.message ||
      "Não foi possível carregar os pedidos.";

  }

}


/* =========================
   RENDER PEDIDOS
========================= */

function renderOrders(orders) {

  if (!orders.length) {

    ordersBody.innerHTML = `
      <tr>
        <td colspan="12" class="empty">
          Nenhum pedido encontrado.
        </td>
      </tr>
    `;

    return;

  }

  ordersBody.innerHTML =
    orders.map(order => {

      return `
        <tr>

          <td>
            ${escapeHtml(order.id)}
          </td>

          <td>
            ${escapeHtml(order.order_id)}
          </td>

          <td>
            ${escapeHtml(order.name)}
          </td>

          <td>
            ${escapeHtml(order.phone)}
          </td>

          <td>
            ${escapeHtml(order.payment)}
          </td>

          <td>
            ${escapeHtml(order.amount)}
          </td>

          <td>
            ${escapeHtml(order.usdt_amount)}
          </td>

          <td class="status">
            ${escapeHtml(order.status)}
          </td>

          <td>
            ${escapeHtml(
              order.mpesa_transaction_id
            )}
          </td>

          <td>
            ${escapeHtml(
              order.emola_transaction_id
            )}
          </td>

          <td>
            ${escapeHtml(
              order.blockchain_tx_hash
            )}
          </td>

          <td>
            ${escapeHtml(
              order.created_at
            )}
          </td>

        </tr>
      `;

    }).join("");

}


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
  "click",
  async function() {

    try {

      await fetch(
        "/api/admin/logout",
        {
          method: "POST",

          credentials: "include"
        }
      );

    } catch (error) {

      console.error(
        "LOGOUT ERROR:",
        error
      );

    }

    adminScreen.classList.add(
      "hidden"
    );

    loginScreen.classList.remove(
      "hidden"
    );

    loginMessage.textContent =
      "Sessão encerrada.";

  }
);


/* =========================
   ATUALIZAR PEDIDOS
========================= */

refreshOrdersButton.addEventListener(
  "click",
  loadOrders
);


/* =========================
   INICIAR
========================= */

checkSession();

</script>

</body>
</html>
