<!DOCTYPE html><html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>USDTMZ</title>  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    main {
      max-width: 600px;
      margin: auto;
    }

    section {
      background: #fff;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h1,
    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
      background: #111;
      color: #fff;
      border: none;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .orders-message {
      margin-top: 15px;
      line-height: 1.6;
    }

    .rate {
      font-weight: bold;
    }
  </style></head><body><main>  <h1>USDTMZ</h1>  <!-- =========================
       SALDO
  ========================= -->  <section id="balanceSection"><h2>Meu saldo</h2>

<div class="balance">
  <span id="usdtBalance">--</span> USDT
</div>

<p>
  Saldo real disponibilizado pelo sistema.
</p>

<button
  type="button"
  id="refreshBalanceButton"
>
  Atualizar saldo
</button>

<div
  id="balanceMessage"
  class="message"
  aria-live="polite"
></div>

  </section>  <!-- =========================
       CONVERSOR / COMPRA
  ========================= -->  <section id="converterSection"><h2>Comprar USDT</h2>

<label for="mznAmount">
  Valor em MZN
</label>

<input
  id="mznAmount"
  type="number"
  min="0"
  step="1"
  placeholder="Ex.: 500"
>

<p class="rate">
  Taxa: 50 MZN = 1 USDT
</p>

<p>
  Você receberá:
  <strong>
    <span id="usdtPreview">0</span> USDT
  </strong>
</p>

  </section>  <!-- =========================
       MÉTODO DE PAGAMENTO
  ========================= -->  <section id="paymentSection"><h2>Forma de pagamento</h2>

<label for="paymentMethod">
  Escolha o método
</label>

<select id="paymentMethod">

  <option value="">
    Selecionar
  </option>

  <option value="mpesa">
    M-Pesa
  </option>

  <option value="emola">
    e-Mola
  </option>

</select>

<label for="paymentPhone">
  Número de telefone
</label>

<input
  id="paymentPhone"
  type="tel"
  placeholder="Ex.: 84xxxxxxx"
  autocomplete="off"
>

<button
  type="button"
  id="buyButton"
>
  Comprar USDT
</button>

<div
  id="paymentMessage"
  class="message"
  aria-live="polite"
></div>

  </section>  <!-- =========================
       RETIRADA USDT
  ========================= -->  <section id="withdrawalSection"><h2>Retirada USDT</h2>

<p>
  Retirada de USDT através da rede TRON TRC-20.
</p>

<label for="withdrawalAddress">
  Endereço TRON
</label>

<input
  id="withdrawalAddress"
  type="text"
  placeholder="Endereço TRON TRC-20"
  autocomplete="off"
>

<label for="withdrawalAmount">
  Valor USDT
</label>

<input
  id="withdrawalAmount"
  type="number"
  min="0"
  step="0.000001"
  placeholder="Ex.: 2"
>

<button
  type="button"
  id="withdrawalButton"
>
  Solicitar retirada
</button>

<div
  id="withdrawalMessage"
  class="orders-message"
  aria-live="polite"
></div>

  </section></main><script>

"use strict";


/* =========================
   CONFIGURAÇÃO
========================= */

const CONFIG = {

  /* 500 MZN = 10 USDT */
  rate: 50,

  apiWallet: "/api/wallet",

  apiBlockchain: "/api/blockchain",

  apiOrder: "/api/order",

  apiWithdrawal: "/api/withdrawal"

};


/* =========================
   FORMATAÇÃO USDT
========================= */

function formatUsdt(value) {

  const number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {
    return "0";
  }

  return number
    .toFixed(6)
    .replace(/\.?0+$/, "");

}


/* =========================
   ESCAPAR HTML
========================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   CONVERSOR
========================= */

const mznAmount =
  document.getElementById(
    "mznAmount"
  );

const usdtPreview =
  document.getElementById(
    "usdtPreview"
  );


function updateConverter() {

  if (!mznAmount || !usdtPreview) {
    return;
  }

  const mzn =
    Number(
      mznAmount.value || 0
    );

  if (
    !Number.isFinite(mzn) ||
    mzn <= 0
  ) {

    usdtPreview.textContent =
      "0";

    return;

  }

  const usdt =
    mzn / CONFIG.rate;

  usdtPreview.textContent =
    formatUsdt(usdt);

}


if (mznAmount) {

  mznAmount.addEventListener(
    "input",
    updateConverter
  );

}


/* =========================
   SALDO
========================= */

async function loadBalance() {

  const balanceElement =
    document.getElementById(
      "usdtBalance"
    );

  const message =
    document.getElementById(
      "balanceMessage"
    );

  if (!balanceElement) {
    return;
  }

  balanceElement.textContent =
    "...";

  if (message) {
    message.textContent =
      "A consultar saldo...";
  }

  try {

    const response =
      await fetch(
        CONFIG.apiWallet,
        {
          method: "GET",

          headers: {
            "Accept":
              "application/json"
          },

          cache: "no-store"

        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "O servidor devolveu uma resposta inválida."
      );

    }


    if (
      !response.ok ||
      !data
    ) {

      throw new Error(
        data?.error ||
        "Não foi possível consultar o saldo."
      );

    }


    const balance =
      data.balance ??
      data.usdt_balance ??
      data.usdt ??
      data.wallet?.balance ??
      data.wallet?.usdt_balance;


    if (
      balance === undefined ||
      balance === null
    ) {

      throw new Error(
        "O backend não devolveu o saldo USDT."
      );

    }


    balanceElement.textContent =
      formatUsdt(balance);


    if (message) {

      message.textContent =
        "Saldo atualizado.";

    }


  } catch (error) {

    console.error(
      "BALANCE ERROR:",
      error
    );

    balanceElement.textContent =
      "--";

    if (message) {

      message.textContent =
        error?.message ||
        "Saldo indisponível.";

    }

  }

}


const refreshBalanceButton =
  document.getElementById(
    "refreshBalanceButton"
  );


if (refreshBalanceButton) {

  refreshBalanceButton.addEventListener(
    "click",
    loadBalance
  );

}


/* =========================
   COMPRA
========================= */

async function buyUsdt() {

  const amountInput =
    document.getElementById(
      "mznAmount"
    );

  const methodInput =
    document.getElementById(
      "paymentMethod"
    );

  const phoneInput =
    document.getElementById(
      "paymentPhone"
    );

  const button =
    document.getElementById(
      "buyButton"
    );

  const message =
    document.getElementById(
      "paymentMessage"
    );


  const mzn =
    amountInput.value.trim();

  const method =
    methodInput.value;

  const phone =
    phoneInput.value.trim();


  if (
    !mzn ||
    Number(mzn) <= 0
  ) {

    message.textContent =
      "Informe o valor em MZN.";

    return;

  }


  if (!method) {

    message.textContent =
      "Escolha M-Pesa ou e-Mola.";

    return;

  }


  if (!phone) {

    message.textContent =
      "Informe o número de telefone.";

    return;

  }


  const usdt =
    Number(mzn) / CONFIG.rate;


  button.disabled =
    true;

  message.textContent =
    "A criar pedido de pagamento...";


  try {

    const response =
      await fetch(
        CONFIG.apiOrder,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body: JSON.stringify({

            amount_mzn:
              mzn,

            amount_usdt:
              usdt.toFixed(6),

            payment_method:
              method,

            phone:
              phone

          })

        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Resposta inválida do servidor."
      );

    }


    if (
      !response.ok ||
      !data ||
      data.success === false
    ) {

      throw new Error(
        data?.error ||
        "Não foi possível criar o pedido."
      );

    }


    message.innerHTML =
      "<strong>Pedido criado.</strong><br>" +
      "Método: " +
      escapeHtml(
        method.toUpperCase()
      ) +
      "<br>Valor: " +
      escapeHtml(mzn) +
      " MZN → " +
      escapeHtml(
        formatUsdt(usdt)
      ) +
      " USDT";


  } catch (error) {

    console.error(
      "BUY ERROR:",
      error
    );

    message.textContent =
      error?.message ||
      "Erro ao criar pedido.";

  } finally {

    button.disabled =
      false;

  }

}


const buyButton =
  document.getElementById(
    "buyButton"
  );


if (buyButton) {

  buyButton.addEventListener(
    "click",
    buyUsdt
  );

}


/* =========================
   VALIDAÇÃO TRON
========================= */

function validateTronAddress(
  address
) {

  return /^T[1-9A-HJ-NP-Za-km-z]{33}$/
    .test(
      String(
        address || ""
      ).trim()
    );

}


/* =========================
   STATUS DA RETIRADA
========================= */

function getWithdrawalStatusText(
  status
) {

  switch (status) {

    case "PENDING":
      return "Aguardando autorização.";

    case "AUTHORIZED":
      return "Retirada autorizada.";

    case "READY_FOR_SECURE_SIGNING":
      return "Pronta para assinatura segura.";

    case "PROCESSING":
      return "Retirada em processamento.";

    case "BROADCASTED":
      return "Transação transmitida para a TRON.";

    case "COMPLETED":
      return "Retirada confirmada na TRON.";

    case "FAILED":
      return "A retirada falhou.";

    default:
      return "Estado: " + status;

  }

}


/* =========================
   RETIRADA
========================= */

async function requestWithdrawal() {

  const addressInput =
    document.getElementById(
      "withdrawalAddress"
    );

  const amountInput =
    document.getElementById(
      "withdrawalAmount"
    );

  const button =
    document.getElementById(
      "withdrawalButton"
    );

  const message =
    document.getElementById(
      "withdrawalMessage"
    );


  const address =
    addressInput.value.trim();

  const amount =
    amountInput.value.trim();


  if (
    !validateTronAddress(
      address
    )
  ) {

    message.textContent =
      "Endereço TRON inválido.";

    return;

  }


  if (
    !/^\d+(\.\d{1,6})?$/
      .test(amount)
  ) {

    message.textContent =
      "Informe um valor USDT válido, com até 6 casas decimais.";

    return;

  }


  const numericAmount =
    Number(amount);


  if (
    !Number.isFinite(
      numericAmount
    ) ||
    numericAmount <= 0
  ) {

    message.textContent =
      "Informe um valor USDT válido.";

    return;

  }


  if (
    numericAmount >
    1000000
  ) {

    message.textContent =
      "O valor máximo por retirada é 1.000.000 USDT.";

    return;

  }


  button.disabled =
    true;

  message.textContent =
    "A criar solicitação de retirada...";


  try {

    const response =
      await fetch(
        CONFIG.apiWithdrawal,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body: JSON.stringify({

            address:
              address,

            amount:
              amount

          })

        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "O servidor devolveu uma resposta inválida."
      );

    }


    if (
      !response.ok ||
      !data ||
      !data.success
    ) {

      throw new Error(
        data?.error ||
        "Não foi possível criar a retirada."
      );

    }


    const withdrawal =
      data.withdrawal ||
      data;


    const withdrawalId =
      withdrawal.withdrawal_id ||
      data.withdrawal_id ||
      "";


    const status =
      String(
        withdrawal.status ||
        data.status ||
        "PENDING"
      ).toUpperCase();


    const txHash =
      withdrawal.tx_hash ||
      data.tx_hash ||
      "";


    let result =
      "<strong>Retirada registada.</strong><br>" +

      "ID: " +
      escapeHtml(
        withdrawalId
      ) +

      "<br>Rede: TRON Mainnet" +

      "<br>Ativo: USDT TRC-20" +

      "<br>Destino: " +
      escapeHtml(
        address
      ) +

      "<br>Valor: " +
      escapeHtml(
        formatUsdt(
          withdrawal.amount ??
          amount
        )
      ) +

      " USDT" +

      "<br>Estado: " +
      escapeHtml(
        getWithdrawalStatusText(
          status
        )
      );


    if (txHash) {

      result +=
        "<br><strong>TXID:</strong> " +
        escapeHtml(
          txHash
        );

    }


    message.innerHTML =
      result;


    addressInput.value =
      "";

    amountInput.value =
      "";


    /* Atualiza o saldo depois da retirada */
    loadBalance();


  } catch (error) {

    console.error(
      "WITHDRAWAL ERROR:",
      error
    );

    message.innerHTML =
      "<strong>Erro:</strong><br>" +
      escapeHtml(
        error?.message ||
        "Não foi possível processar a retirada."
      );

  } finally {

    button.disabled =
      false;

  }

}


const withdrawalButton =
  document.getElementById(
    "withdrawalButton"
  );


if (withdrawalButton) {

  withdrawalButton.addEventListener(
    "click",
    requestWithdrawal
  );

}


/* =========================
   INICIALIZAÇÃO
========================= */

updateConverter();

loadBalance();

</script></body>
</html>
