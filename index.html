<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDTMZ</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0b5cff;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd3df;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #0b5cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .result {
      margin-top: 18px;
      padding: 15px;
      background: #eef5ff;
      border-radius: 10px;
      text-align: center;
    }

    .result strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
      color: #0b5cff;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #e8fff2;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #687386;
    }
  </style>
</head>

<body>

<header>
  <h1>USDTMZ</h1>
  <p>Compra e venda de USDT</p>
</header>

<main class="container">

  <section class="card">

    <h2>Conversor USDT / MZN</h2>

    <label>Operação</label>

    <select id="operation" onchange="calculate()">
      <option value="buy">Comprar USDT</option>
      <option value="sell">Vender USDT</option>
    </select>

    <label id="amountLabel">Valor em MZN</label>

    <input
      id="amount"
      type="number"
      min="0"
      placeholder="Ex.: 640"
      oninput="calculate()"
    >

    <div class="result">
      <span>Você receberá aproximadamente</span>
      <strong id="result">0 USDT</strong>
    </div>

    <p>
      Taxa de referência:
      <strong>1 USDT = 64 MZN</strong>
    </p>

  </section>


  <section class="card">

    <h2>Fazer pedido</h2>

    <label>Nome</label>

    <input
      id="name"
      type="text"
      placeholder="Seu nome"
    >

    <label>Telefone</label>

    <input
      id="phone"
      type="tel"
      placeholder="84xxxxxxx"
    >

    <button onclick="createOrder()">
      Continuar pedido
    </button>

    <div id="orderMessage" class="message"></div>

  </section>


  <section class="card">

    <h2>Minha carteira</h2>

    <div class="result">
      <span>Saldo de teste</span>
      <strong>0.00 USDT</strong>
    </div>

    <button onclick="showTestMessage()">
      Enviar para minha Binance
    </button>

    <div id="testMessage" class="message"></div>

  </section>

</main>

<footer>
  © 2026 USDTMZ
</footer>


<script>

const RATE = 64;


function calculate() {

  const operation =
    document.getElementById("operation").value;

  const amount =
    Number(document.getElementById("amount").value) || 0;

  const label =
    document.getElementById("amountLabel");

  const result =
    document.getElementById("result");


  if (operation === "buy") {

    label.innerText = "Valor em MZN";

    result.innerText =
      (amount / RATE).toFixed(2) + " USDT";

  } else {

    label.innerText = "Quantidade em USDT";

    result.innerText =
      (amount * RATE).toFixed(2) + " MZN";
  }
}


async function createOrder() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  const operation =
    document.getElementById("operation").value;

  const message =
    document.getElementById("orderMessage");


  if (!name || !phone || !amount || amount <= 0) {

    alert(
      "Preencha o nome, telefone e valor."
    );

    return;
  }


  message.style.display = "block";

  message.innerText =
    "A preparar o pedido...";


  try {

    const response =
      await fetch("/api/order", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          name: name,
          phone: phone,
          operation: operation,
          amount: amount
        })
      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Não foi possível criar o pedido."
      );
    }


    message.innerHTML =
      "<strong>Pedido recebido!</strong><br>" +
      "Número: " +
      data.orderId +
      "<br>Estado: PENDING";


  } catch (error) {

    message.innerText =
      "A API ainda não está configurada.";

  }
}


function showTestMessage() {

  const message =
    document.getElementById("testMessage");

  message.style.display = "block";

  message.innerHTML =
    "<strong>Modo de teste</strong><br>" +
    "O envio para Binance será configurado " +
    "depois. Nenhum USDT real foi movimentado.";
}

</script>

</body>
</html>
